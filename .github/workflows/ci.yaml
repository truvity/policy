# Calls the shared workflow (truvity/ci-workflows), which runs each Justfile
# recipe as its OWN parallel job, reported under its own name.
#
# Pinned by COMMIT SHA, never a tag — tags move, and this code runs in every
# repository of both organizations.
#
# Hosted runners only, and not by accident: a public repository's pull
# requests come from forks, and a fork's code must never execute on the
# estate's own infrastructure. The shared workflow's default runner is
# `ubuntu-latest`, so this caller names none.
name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  recipes:
    uses: truvity/ci-workflows/.github/workflows/check.yaml@36be6b238bfb119de3ffeed9604bae5e7a3d7c8d # v3.4.0
    with:
      recipes: '["build", "test", "lint", "vuln", "drift", "leak-canary"]'

  # The TypeScript package installs from a registry, which is why it is not in
  # `check`: the gate must need nothing but the checkout.
  ts:
    uses: truvity/ci-workflows/.github/workflows/check.yaml@36be6b238bfb119de3ffeed9604bae5e7a3d7c8d # v3.4.0
    with:
      recipes: '["ts"]'

  # The committed renders, against the Kubernetes API's own schemas. It asks
  # a question the chart tests do not: they check that a rendered file is one
  # the BINARY accepts, and would pass just as happily for a Deployment with
  # a misspelled field — because the API server ignores one rather than
  # refusing it.
  charts:
    uses: truvity/ci-workflows/.github/workflows/check.yaml@36be6b238bfb119de3ffeed9604bae5e7a3d7c8d # v3.4.0
    with:
      recipes: '["charts"]'

  # The local cluster, stood up from nothing — servers only, no operator; see
  # docs/decisions/0005-kind-is-the-gate.md and hack/kind/README.md — asked
  # whether each server it carries is usable, and then made to run the
  # example end to end, the example's own fixture standing in for the infra
  # chart kind never installs.
  #
  # This is the gate decision 0005 describes. It runs on pull requests
  # because it is now the only place several things are checked at all: that
  # a migration can create what it owns, that the two database roles are
  # actually separate, that an event crosses a broker, and that a consumer
  # bound to a subject moves a counter it has rights on. Every one of those
  # was broken here at some point while the example was built, and not one
  # of them is visible to a renderer.
  cluster:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Full history AND tags: `example-snapshot` runs `.goreleaser.yaml`
      # itself, and GoReleaser resolves its own version from the nearest
      # git tag even with validation skipped — a shallow checkout (this
      # action's default) has none, and the release fails before it builds
      # anything.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: jetify-com/devbox-install-action@22b0f5500b14df4ea357ce673fbd4ced940ed6a1 # v0.13.0
        with:
          enable-cache: "true"
      # The release build (images pushed, chart packaged) needs nothing the
      # box provides — it only needs the box's registry, which `just cluster`
      # starts within the first few seconds of standing the box up, long
      # before the release build's own compile step finishes. So it runs
      # IN THE BACKGROUND while the box comes up and the fixture provisions
      # for the install, rather than after them: the two costs used to be
      # serial and neither depends on the other's result, only on the
      # registry existing before the build's push step is reached.
      - name: the box and its fixture stand up while the release builds
        run: |
          devbox run -- just example-snapshot > /tmp/example-snapshot.log 2>&1 &
          snapshot_pid=$!

          devbox run -- just cluster
          devbox run -- just cluster-verify
          devbox run -- just example-fixture

          if ! wait "$snapshot_pid"; then
            echo "::group::example-snapshot"
            cat /tmp/example-snapshot.log
            echo "::endgroup::"
            exit 1
          fi
          cat /tmp/example-snapshot.log
      - name: the example installs
        run: devbox run -- just example-install
      - name: the example works
        run: devbox run -- just example-smoke
      - name: what the cluster saw, if it did not
        if: failure()
        run: |
          kubectl get pods -A || true
          kubectl -n shortener describe pods || true
          kubectl -n shortener logs -l app.kubernetes.io/name=url-shortener --all-containers --tail=50 || true
          kubectl -n postgres logs deploy/postgres --tail=50 || true
          kubectl -n nats logs statefulset/nats --tail=50 || true

  # Stable name for branch protection: the matrix reports as "recipes / lint"
  # and so on, so a required context called "check" would never arrive and
  # every pull request would hang waiting for it.
  check:
    needs: [recipes, ts, charts]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          [ "${{ needs.recipes.result }}" = "success" ] &&
          [ "${{ needs.ts.result }}" = "success" ] &&
          [ "${{ needs.charts.result }}" = "success" ]
