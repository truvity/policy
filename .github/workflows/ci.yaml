# Calls the shared workflow (truvity/ci-workflows), which runs each Justfile
# recipe as its OWN parallel job, reported under its own name.
#
# Pinned by COMMIT SHA, never a tag — tags move, and this code runs in every
# repository of both organizations.
#
# Hosted runners only, and not by accident: a public repository's pull
# requests come from forks, and a fork's code must never execute on the
# estate's own infrastructure. The shared workflow's default runner is
# `ubuntu-latest`, so this caller names none.
name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  recipes:
    uses: truvity/ci-workflows/.github/workflows/check.yaml@51bc0eb7d5d89931d336219f87bde091deaf48ed # v5.4.0
    with:
      # Required: the component contract (C1-C13) is judged, shown in the
      # job summary, and fails this job when a rule fails.
      policy-conformance: true
      policy-conformance-strict: true
      # `vuln` is not here: it runs in security.yaml, on a schedule, where a
      # new advisory is reported without turning every pull request red
      # (the component contract's C10).
      recipes: '["build", "test", "lint", "leak-canary"]'
      # GitHub's own cache (this repository runs on hosted runners and
      # reaches no other): `cache-paths` keeps the Go build cache and the Go
      # module cache between runs, one cache per recipe, saved once per
      # change of go.sum or devbox.lock. Without a cache bucket the shared
      # workflow stores them through actions/cache.
      cache-paths: |
        ~/.cache/go-build
        ~/go/pkg/mod
      cache-key-files: |
        **/go.sum
        devbox.lock

  # Stable name for branch protection: the matrix reports as "recipes / lint"
  # and so on, so a required context called "check" would never arrive and
  # every pull request would hang waiting for it.
  check:
    needs: [recipes]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          [ "${{ needs.recipes.result }}" = "success" ]
