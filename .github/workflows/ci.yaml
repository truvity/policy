# Calls the shared workflow (truvity/ci-workflows), which runs each Justfile
# recipe as its OWN parallel job, reported under its own name.
#
# Pinned by COMMIT SHA, never a tag — tags move, and this code runs in every
# repository of both organizations.
#
# Hosted runners only, and not by accident: a public repository's pull
# requests come from forks, and a fork's code must never execute on the
# estate's own infrastructure. The shared workflow's default runner is
# `ubuntu-latest`, so this caller names none.
name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  recipes:
    uses: truvity/ci-workflows/.github/workflows/check.yaml@30b989fdd77b99af4be1a4b04e6353aa58aa3923 # v3.21.0
    with:
      # Required: the component contract (C1-C13) is judged, shown in the
      # job summary, and fails this job when a rule fails.
      policy-conformance: true
      policy-conformance-strict: true
      # `vuln` is not here: it runs in security.yaml, on a schedule, where a
      # new advisory is reported without turning every pull request red
      # (the component contract's C10).
      recipes: '["build", "test", "lint", "drift", "leak-canary"]'

  # The TypeScript package installs from a registry, which is why it is not in
  # `check`: the gate must need nothing but the checkout.
  ts:
    uses: truvity/ci-workflows/.github/workflows/check.yaml@30b989fdd77b99af4be1a4b04e6353aa58aa3923 # v3.21.0
    with:
      recipes: '["ts"]'

  # The committed renders, against the Kubernetes API's own schemas. It asks
  # a question the chart tests do not: they check that a rendered file is one
  # the BINARY accepts, and would pass just as happily for a Deployment with
  # a misspelled field — because the API server ignores one rather than
  # refusing it.
  charts:
    uses: truvity/ci-workflows/.github/workflows/check.yaml@30b989fdd77b99af4be1a4b04e6353aa58aa3923 # v3.21.0
    with:
      recipes: '["charts"]'

  # The shadow phase of decision 0010 (docs/guides/pkl-shadow.md). Two
  # recipes, each its own job: `shadow-generated` is STRICT (the committed
  # artifacts generated from the Pkl contract are current) and `shadow-diff`
  # is REPORT-ONLY (it writes every difference between the generated schemas
  # and the hand-written ones to the job summary, and fails only if
  # generation does). Neither is in `check`: they fetch Pkl and the contracts'
  # packages from GitHub, and the gate needs nothing but the checkout.
  shadow:
    uses: truvity/ci-workflows/.github/workflows/check.yaml@30b989fdd77b99af4be1a4b04e6353aa58aa3923 # v3.21.0
    with:
      recipes: '["shadow-generated", "shadow-diff"]'

  # The local cluster, stood up from nothing — servers only, no operator; see
  # docs/decisions/0005-kind-is-the-gate.md and hack/kind/README.md — asked
  # whether each server it carries is usable, and then made to run the
  # example end to end, the example's own fixture standing in for the infra
  # chart kind never installs.
  #
  # This is the gate decision 0005 describes. It runs on pull requests
  # because it is now the only place several things are checked at all: that
  # a migration can create what it owns, that the two database roles are
  # actually separate, that an event crosses a broker, and that a consumer
  # bound to a subject moves a counter it has rights on. Every one of those
  # was broken here at some point while the example was built, and not one
  # of them is visible to a renderer.
  #
  # The `test` step also installs the url-shortener-e2e TEST CHART and
  # proves ITS Job completes — the same e2e image, but run by that chart's
  # own scoped ServiceAccount, inside the cluster, with no fixture and no
  # `helm` in its image. `example-smoke` running the identical suite
  # directly from this box's own devbox environment (helm on PATH there)
  # does not exercise that path at all.
  #
  # Through the shared integration workflow now, on its kind tier (this
  # repository is public — see truvity/ci-workflows' docs/tiers.md): the
  # workflow stands up the box itself, via truvity/ci-actions' `cluster`
  # action, mode: kind, fetching THIS repository's own hack/kind/ at a
  # pinned release tag — so the recipe this job runs is exactly what a
  # laptop runs, one lane's build/install/test, and standing the box up
  # is no longer this repository's own job to script.
  #
  # `check` below still names this job — a reusable workflow cannot supply
  # a required status context of its own (the same comment lives in
  # ci-workflows' integration.yaml), so the fan-in has to be the calling
  # job, exactly as it already was.
  cluster:
    uses: truvity/ci-workflows/.github/workflows/integration.yaml@30b989fdd77b99af4be1a4b04e6353aa58aa3923 # v3.21.0
    permissions:
      contents: read
      id-token: write
    with:
      policy-version: v1.28.7
      gemaal-namespace: shortener
      timeout-minutes: 30
      lanes: |
        [
          {
            "name": "example",
            "build": "devbox run -- just example-snapshot",
            "install": "devbox run -- just example-fixture && devbox run -- just example-install",
            "test": "devbox run -- just example-smoke && devbox run -- just example-e2e-chart && devbox run -- just example-prober"
          }
        ]

  # Stable name for branch protection: the matrix reports as "recipes / lint"
  # and so on, so a required context called "check" would never arrive and
  # every pull request would hang waiting for it. The cluster job gates merges:
  # all tests, including the end-to-end suite, must be green.
  check:
    needs: [recipes, ts, charts, shadow, cluster]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          [ "${{ needs.recipes.result }}" = "success" ] &&
          [ "${{ needs.ts.result }}" = "success" ] &&
          [ "${{ needs.charts.result }}" = "success" ] &&
          [ "${{ needs.shadow.result }}" = "success" ] &&
          [ "${{ needs.cluster.result }}" = "success" ]
