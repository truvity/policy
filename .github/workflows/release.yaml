# Tag-triggered release.
#
# Two artifacts come out of one tag, which is the release contract's first
# rule: the Go module (a tag is all the module proxy needs) and the library
# chart `service-lib`, published to the chart registry under the tag's
# version. The GitHub Release and its changelog are cut by the same shared
# workflow, through GoReleaser with every build skipped (.goreleaser.yaml).
#
# The url-shortener example and the TypeScript, Python and Kotlin loaders
# moved to their own repository, which releases its charts and images on its
# own tags; nothing here ships them any more.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

# Never cancel a running publish — a half-published artifact set is worse
# than a queued wait, and a version that failed halfway is burned.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The GitHub Release and its changelog. The caller grants the permissions
  # because a reusable workflow can narrow them but never widen them.
  release:
    permissions:
      contents: write
      packages: write
    uses: truvity/ci-workflows/.github/workflows/release-public.yaml@32deafafdd283883ae3d8211ce25105be0f588a6 # v5.8.1
    with:
      # ONE chart, the library chart `service-lib`. It renders nothing of its
      # own: it is what another repository's service chart renders its
      # components with (docs/guides/charts.md), published so that chart can
      # depend on the same bytes this repository tests. It lives at the
      # repository root, `charts/service-lib`: an entry with a `/` is a path
      # from the repository root, and `chart-root` does not apply to it.
      # No images are built here, so `chart-images` stays off and the chart
      # is packaged from the tag.
      charts: '["charts/service-lib"]'
