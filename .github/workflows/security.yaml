# Known vulnerabilities in what this repository depends on: the `vuln`
# recipe, through the same shared workflow that runs every other recipe.
#
# Deliberately NOT in ci.yaml's recipe list, NOT in `just check`, and not a
# required context (the component contract's C10). A new advisory is news
# about the world, not about the change under review: a standard-library
# advisory with no released fix would otherwise turn every pull request red
# on a finding nobody can act on. Here it is reported on every push and pull
# request and once a day, and blocks nothing.
#
# Pinned by COMMIT SHA with the tag in a comment, like every other caller.
name: Security

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: "0 6 * * *" # daily 6am UTC

permissions:
  contents: read

jobs:
  govulncheck:
    uses: truvity/ci-workflows/.github/workflows/check.yaml@02d66a9a2d64fe255d7703a1bebd764d0899f187 # v3.16.0
    with:
      recipes: '["vuln"]'
