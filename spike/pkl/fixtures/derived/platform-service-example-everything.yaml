config:
  mountPath: /etc/echo
  pathEnv: CONFIG_FILE
drain:
  preStopSeconds: 7
env:
- name: EXAMPLE_CLIENT_HOST
  value: client.example.invalid
image:
  digest: sha256:1111111111111111111111111111111111111111111111111111111111111111
  registry: example.io
  repository: example/echo-custom
  tag: 9.9.9
imagePullPolicy: Always
podSecurity:
  fsGroup: 9012
  runAsGroup: 5678
  runAsUser: 1234
probes:
  liveness:
    failureThreshold: 4
    path: /live
    periodSeconds: 7
  readiness:
    path: /ready
    periodSeconds: 3
    timeoutSeconds: 2
  startup:
    failureThreshold: 30
    path: /ready
    periodSeconds: 2
replicas: 3
resources:
  limits:
    memory: 222Mi
  requests:
    cpu: 11m
    memory: 111Mi
secrets:
  STORE_TOKEN:
    key: token
    secretName: example-store
serviceAccount:
  annotations:
    example.invalid/role: echo
  name: echo-account
strategy:
  maxSurge: 2
  maxUnavailable: 1
telemetry:
  endpoint: http://collector.example.invalid:4318
  protocol: http/protobuf
  resourceAttributes:
    deployment.example.tier: primary
  sampleRatio: '0.25'
  serviceName: echo-service
  tracesSampler: parentbased_traceidratio
tls:
  csiDriver: example.csi.invalid
  mountPath: /var/run/example-identity
volumeMounts:
- mountPath: /etc/example-extra
  name: extra
  readOnly: true
volumes:
- configMap:
    name: example-extra
  name: extra
