kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
# One node. A multi-node cluster would test scheduling, which nothing in a
# chart's contract depends on, and would cost minutes on every run.
nodes:
  - role: control-plane
# kind's own documented local-registry recipe
# (https://kind.sigs.k8s.io/docs/user/local-registry/): `config_path` points
# containerd at a per-registry directory, and `up.sh` writes a `hosts.toml`
# into it on every node once the registry container exists — the directory
# has to be named in the cluster's own config, but the file inside it can
# only be written after the node does.
containerdConfigPatches:
  - |-
    [plugins."io.containerd.grpc.v1.cri".registry]
      config_path = "/etc/containerd/certs.d"
# One node means one controller-manager and one scheduler: there is no
# second one to hand off to, so leader election only adds a way to die.
# Measured here: under host load the API server answers a lease renewal
# too slowly, the component exits on "leaderelection lost", and nothing
# reconciles until it restarts — no default ServiceAccount for a fresh
# namespace, no rollout progress. `verify.sh` asserts the RUNNING pods
# carry this flag, not just that the config asked for it.
# kind generates kubeadm v1beta3 config, which uses extraArgs as a map (not v1beta4 list).
kubeadmConfigPatches:
  - |
    kind: ClusterConfiguration
    controllerManager:
      extraArgs:
        leader-elect: "false"
    scheduler:
      extraArgs:
        leader-elect: "false"
