# The authority this box issues workload identities under.
#
# Self-signed, and that is correct here: the point of the local cluster is to
# prove that a service presents an identity, reloads it and checks its peers.
# Whose signature is on it is the platform's question, and a deployment
# answers it with a real authority. What matters is that the SHAPE is the
# same — an identity attested by the runtime, not asserted by the workload.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: policy-trust-root
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: policy-trust
  namespace: cert-manager
spec:
  isCA: true
  commonName: policy-trust
  secretName: policy-trust
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: policy-trust-root
    kind: ClusterIssuer
---
# What the driver asks for certificates from. It must be able to sign a URI
# name: an identity is a URI, and an authority that only signs host names
# would refuse every request the driver makes.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: policy-workload
spec:
  ca:
    secretName: policy-trust
