# The authority workload identities are issued under.
#
# Its key pair is a FIXTURE, generated by up.sh and applied as a secret, not
# a Certificate cert-manager is asked to produce. That is not a shortcut —
# it is a consequence of the line above it in up.sh.
#
# Disabling cert-manager's blanket approver disables it for EVERYTHING,
# including cert-manager's own bootstrap. A self-signed CA expressed as a
# Certificate needs its request approved like any other, and with the blanket
# approver gone and the identity driver's approver only handling the driver's
# requests, nothing approves it: the certificate never becomes ready and the
# box never finishes standing up. A real deployment answers this with a
# policy engine that says which requests are allowed. A throwaway root for a
# test cluster does not need one.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: policy-workload
spec:
  ca:
    secretName: policy-trust
