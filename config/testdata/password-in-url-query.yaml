# The password as a query parameter. The URL has no user information at all,
# so a rule that only looked for user:password@ would let it through.
listen:
  address: ":8080"
probes:
  address: ":7070"
baseURL: https://example.com
database:
  url: postgres://shortener@db:5432/shortener?sslmode=require&password=hunter2-this-must-never-be-echoed
