# The release, as one tool and nothing of ours beside it.
#
# This repository ships no binary and no image: its artifacts are the Go
# module (a tag is all the module proxy needs) and the library chart
# `charts/service-lib`, which the shared release workflow packages and pushes
# with helmctl after this has run. GoReleaser is still the step that cuts the
# GitHub Release and writes its changelog, which is why the file stays: the
# shared workflow runs it unconditionally, and with every build skipped it has
# nothing to compile.
version: 2

project_name: policy

builds:
  - skip: true

changelog:
  sort: asc
  filters:
    exclude:
      - "^chore"
      - "^ci"
      - "^docs"
      - "^test"

# The shared workflow sets GITHUB_RELEASE_DISABLED, so that the same
# configuration can be run locally without cutting a release. NEVER
# `--snapshot` for that: pass `--skip=validate,publish` instead.
release:
  github: {}
  disable: "{{ .Env.GITHUB_RELEASE_DISABLED }}"
